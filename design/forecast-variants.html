<!-- @dsCard group="Particle Man Card" -->
<title>Harmonized forecast — two shapes</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: #808289; }
  .mock-stage { background: var(--primary-background-color); padding: 20px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 16px; }
  .variant-label { font: 650 12px/1.4 var(--pmc-font); color: var(--primary-text-color); }
  .variant-label small { display: block; font-weight: 400; color: var(--secondary-text-color); }
  .tempchart { width: 100%; height: 84px; display: block; }
  .bandrow { display: grid; grid-template-columns: var(--pmc-label-col) 1fr; column-gap: var(--pmc-row-gap); align-items: center; }
  .bandrow .pmc-panel-title { font-size: 10px; }

  /* Variant D: daily view — per-day columns sharing one grid */
  .daily { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .daily .day { display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: var(--pmc-font-meta); color: var(--secondary-text-color); }
  .daily .day b { color: var(--primary-text-color); font-size: 13px; font-weight: 600; }
  .daily .day .lo { font-variant-numeric: tabular-nums; }
  .daily .cell { width: 100%; height: 10px; border-radius: 3px; background: var(--row-color); }
</style>

<div class="mock-pair">
  <div class="mock-col" data-theme="light">
    <span class="tag">Light</span>
    <div class="mock-stage" id="stage-light"></div>
  </div>
  <div class="mock-col" data-theme="dark">
    <span class="tag">Dark</span>
    <div class="mock-stage" id="stage-dark"></div>
  </div>
</div>

<template id="stage-template">
  <!-- ── Variant A: bands under the chart (recommended) ─────────────────── -->
  <div class="variant-label">A · Aligned bands
    <small>AQ / precip as category-colored strips sharing the chart's time axis.
    Reads categorically — matches the bar language of the panels.</small>
  </div>
  <div class="ha-card">
    <div class="pmc-panel">
      <svg class="tempchart" viewBox="0 0 400 84" preserveAspectRatio="none" aria-hidden="true">
        <polyline fill="none" stroke="var(--primary-color)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" points="" class="temppoly"/>
      </svg>
      <div class="pmc-axis"><span>3 PM</span><span>9 PM</span><span>3 AM</span><span>9 AM</span><span>3 PM</span></div>
      <div class="bandrow">
        <span class="pmc-panel-title">Air quality</span>
        <div class="pmc-bands aqband"></div>
      </div>
      <div class="bandrow">
        <span class="pmc-panel-title">Pollen</span>
        <div class="pmc-bands pollenband"></div>
      </div>
    </div>
  </div>

  <!-- ── Variant B: AQI as a second chart series ────────────────────────── -->
  <div class="variant-label">B · Second series on the chart
    <small>UAQI as its own line (right axis). Continuous, but two lines compete
    and the category colors are lost.</small>
  </div>
  <div class="ha-card">
    <div class="pmc-panel">
      <svg class="tempchart" viewBox="0 0 400 84" preserveAspectRatio="none" aria-hidden="true">
        <polyline fill="none" stroke="var(--primary-color)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" points="" class="temppoly"/>
        <polyline fill="none" stroke="#84cf33" stroke-width="2" stroke-dasharray="4 3"
          stroke-linecap="round" stroke-linejoin="round" points="" class="aqpoly"/>
      </svg>
      <div class="pmc-axis"><span>3 PM</span><span>9 PM</span><span>3 AM</span><span>9 AM</span><span>3 PM</span></div>
      <div class="pmc-footer">— temperature &nbsp; ┅ Universal AQI</div>
    </div>
  </div>

  <!-- ── Daily view (applies to either variant) ─────────────────────────── -->
  <div class="variant-label">Daily view
    <small>Per-day columns; AQ and pollen cells share the day grid. Worst hour
    of each day (v1.7.0 fix), colors from the integration.</small>
  </div>
  <div class="ha-card">
    <div class="pmc-panel">
      <div class="daily">
        <div class="day"><span>Wed</span><b>88°</b><span class="lo">71°</span>
          <div class="cell" style="--row-color:#ff8c00"></div>
          <div class="cell" style="--row-color:#ff7600"></div></div>
        <div class="day"><span>Thu</span><b>84°</b><span class="lo">69°</span>
          <div class="cell" style="--row-color:#ffff00"></div>
          <div class="cell" style="--row-color:#ff7600"></div></div>
        <div class="day"><span>Fri</span><b>81°</b><span class="lo">66°</span>
          <div class="cell" style="--row-color:#ffff00"></div>
          <div class="cell" style="--row-color:#ffba00"></div></div>
        <div class="day"><span>Sat</span><b>80°</b><span class="lo">64°</span>
          <div class="cell" style="--row-color:#84cf33"></div>
          <div class="cell" style="--row-color:#ffba00"></div></div>
        <div class="day"><span>Sun</span><b>82°</b><span class="lo">65°</span>
          <div class="cell" style="--row-color:#84cf33"></div>
          <div class="cell" style="--row-color:#84cf33"></div></div>
      </div>
      <div class="bandrow" style="grid-template-columns: auto 1fr; gap: 10px">
        <span class="pmc-footer">rows: air quality · pollen</span>
      </div>
    </div>
  </div>
</template>

<script>
  const temps = [76,75,74,74,73,73,74,77,80,83,85,87,88,88,87,85,83,81,80,79,78,78,77,76];
  const aqi   = [50,48,38,36,34,36,44,48,52,62,66,68,70,72,74,76,74,72,68,66,64,58,56,54];
  const line = (vals, lo, hi) => vals.map((v, i) =>
    `${(i / (vals.length - 1)) * 400},${74 - ((v - lo) / (hi - lo)) * 62}`).join(" ");
  const aqColors = ["#ffff00","#ffff00","#ff8c00","#ff8c00","#ff8c00","#ff8c00","#ffff00","#ffff00",
                    "#ffff00","#84cf33","#84cf33","#84cf33","#84cf33","#84cf33","#009e3a","#009e3a",
                    "#84cf33","#84cf33","#84cf33","#84cf33","#84cf33","#ffff00","#ffff00","#ffff00"];
  const pollenColors = ["#ff7600","#ff7600","#ff7600","#ffba00","#ffba00","#ffba00","#84cf33","#84cf33",
                        "#84cf33","#84cf33","#ffba00","#ffba00","#ff7600","#ff7600","#ff7600","#ff7600",
                        "#ffba00","#ffba00","#ffba00","#84cf33","#84cf33","#84cf33","#84cf33","#84cf33"];

  for (const side of ["light", "dark"]) {
    const stage = document.getElementById(`stage-${side}`);
    stage.append(document.getElementById("stage-template").content.cloneNode(true));
    for (const poly of stage.querySelectorAll(".temppoly")) poly.setAttribute("points", line(temps, 73, 88));
    for (const poly of stage.querySelectorAll(".aqpoly")) poly.setAttribute("points", line(aqi, 0, 100));
    const fill = (sel, colors) => {
      for (const band of stage.querySelectorAll(sel)) {
        for (const c of colors) {
          const cell = document.createElement("div");
          cell.className = "pmc-band";
          cell.style.setProperty("--row-color", c);
          band.append(cell);
        }
      }
    };
    fill(".aqband", aqColors);
    fill(".pollenband", pollenColors);
  }
</script>
